<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desta Works</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#0a0a1a 0%,#0f1628 40%,#121a2e 70%,#1a1510 100%);color:#F8F6F1;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(139,115,85,.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes barGrow{from{height:0}to{height:var(--h)}}
@keyframes badgePop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes progressFill{from{width:0}to{width:var(--w)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.grid-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.field-label{font-size:10px;color:rgba(248,246,241,.3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.field-input{width:100%;padding:13px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#F8F6F1;font-size:14px;font-family:inherit;transition:all .2s;outline:none}
.field-input:focus{border-color:rgba(139,115,85,.4);background:rgba(255,255,255,.06)}
.field-input::placeholder{color:rgba(248,246,241,.2)}
.sign-btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;background:linear-gradient(135deg,#8B7355,#A68B6B);color:#F8F6F1;letter-spacing:.3px}
.sign-btn:hover{box-shadow:0 8px 24px rgba(139,115,85,.2)}
.sign-btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.error-msg{font-size:12px;color:#FF8A80;background:rgba(255,138,128,.08);border:1px solid rgba(255,138,128,.12);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.plat-row{display:flex;gap:8px;margin-bottom:24px}
.plat-opt{flex:1;padding:16px 10px;border:1px solid rgba(255,255,255,.06);border-radius:12px;cursor:pointer;transition:all .25s;text-align:center;background:rgba(255,255,255,.02)}
.plat-opt:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.plat-opt.on{border-color:rgba(139,115,85,.4);background:rgba(139,115,85,.06);box-shadow:0 0 0 3px rgba(139,115,85,.08)}
.plat-name{font-size:13px;font-weight:700;margin-top:10px;color:#F8F6F1}
.plat-sub{font-size:10px;color:rgba(248,246,241,.3);margin-top:3px}
.plat-icon{width:36px;height:36px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.uni-row{display:flex;gap:8px;margin-bottom:20px}
.uni-opt{flex:1;padding:14px 10px;border:1px solid rgba(255,255,255,.06);border-radius:10px;cursor:pointer;transition:all .25s;text-align:center;background:rgba(255,255,255,.02)}
.uni-opt:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.uni-opt.on{border-color:rgba(139,115,85,.4);background:rgba(139,115,85,.06);box-shadow:0 0 0 3px rgba(139,115,85,.08)}
.divider{height:1px;background:rgba(255,255,255,.06);margin:20px 0}
@media(max-width:480px){.plat-row{gap:6px}.plat-opt{padding:14px 6px}}
</style>
<script type="text/babel">
var useState=React.useState,useEffect=React.useEffect;

/* ========== INTRO VISUALIZATIONS ========== */
function PipelineViz(){var _a=useState(0),a=_a[0],sA=_a[1];
useEffect(function(){var t=setTimeout(function(){if(a<9)sA(a+1)},120);return function(){clearTimeout(t)}},[a]);
var stages=["New","Screen","Review","Submit","Interview","Offer","Onboard","Placed","Future"];
var colors=["#42A5F5","#AB47BC","#FB8C00","#26A69A","#5C6BC0","#EC407A","#FFA726","#66BB6A","#78909C"];
var heights=[80,65,55,50,40,35,30,45,25];
return <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:6,height:90,marginBottom:8}}>
{stages.map(function(s,i){return <div key={s} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
<div style={{width:28,height:a>i?heights[i]*0.8:0,background:a>i?colors[i]:"transparent",borderRadius:4,transition:"height .3s ease"}}/>
<div style={{fontSize:8,color:a>i?"rgba(248,246,241,.5)":"rgba(248,246,241,.15)",transition:"color .3s"}}>{s}</div></div>})}</div>}

function CredentialViz(){var creds=["PMHNP-BC","LCSW","MD","PsyD","NP","LMFT"];
var _a=useState(0),a=_a[0],sA=_a[1];
useEffect(function(){var t=setTimeout(function(){if(a<creds.length)sA(a+1)},200);return function(){clearTimeout(t)}},[a]);
return <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:8}}>
{creds.map(function(c,i){var active=i<a;return <div key={c} style={{padding:"8px 16px",borderRadius:20,border:"1px solid "+(active?"rgba(248,246,241,.2)":"rgba(248,246,241,.06)"),background:i===3&&active?"#8B7355":active?"rgba(255,255,255,.04)":"transparent",color:active?"#F8F6F1":"rgba(248,246,241,.15)",fontSize:13,fontWeight:600,transition:"all .3s",transform:active?"scale(1)":"scale(.9)"}}>{c}</div>})}</div>}

function PayerViz(){var payers=[{n:"Aetna",w:85},{n:"Anthem",w:70},{n:"Cigna",w:55},{n:"United",w:40},{n:"Medicare",w:90}];
var _a=useState(0),a=_a[0],sA=_a[1];
useEffect(function(){var t=setTimeout(function(){if(a<5)sA(a+1)},250);return function(){clearTimeout(t)}},[a]);
return <div style={{display:"flex",flexDirection:"column",gap:6,maxWidth:280,margin:"0 auto"}}>
{payers.map(function(p,i){return <div key={p.n} style={{display:"flex",alignItems:"center",gap:8,opacity:i<a?1:.15,transition:"opacity .3s"}}>
<div style={{fontSize:10,color:"rgba(248,246,241,.5)",minWidth:56}}>{p.n}</div>
<div style={{flex:1,height:8,background:"rgba(255,255,255,.06)",borderRadius:4,overflow:"hidden"}}>
<div style={{height:"100%",width:i<a?p.w+"%":"0%",background:p.w>=80?"#66BB6A":p.w>=60?"#8B7355":"#42A5F5",borderRadius:4,transition:"width .5s ease"}}/></div>
<div style={{fontSize:10,color:"rgba(248,246,241,.4)",minWidth:24,textAlign:"right"}}>{i<a?p.w+"%":""}</div></div>})}</div>}

function ComplianceViz(){var items=[{n:"State License",d:45,c:"#66BB6A"},{n:"DEA",d:12,c:"#FB8C00"},{n:"Malpractice",d:90,c:"#66BB6A"},{n:"Board Cert",d:3,c:"#E53935"},{n:"CAQH",d:60,c:"#66BB6A"}];
var _a=useState(0),a=_a[0],sA=_a[1];
useEffect(function(){var t=setTimeout(function(){if(a<items.length)sA(a+1)},220);return function(){clearTimeout(t)}},[a]);
return <div style={{display:"flex",flexDirection:"column",gap:5,maxWidth:260,margin:"0 auto"}}>
{items.map(function(it,i){return <div key={it.n} style={{display:"flex",alignItems:"center",gap:8,opacity:i<a?1:.15,transition:"opacity .3s"}}>
<div style={{width:6,height:6,borderRadius:3,background:i<a?it.c:"rgba(255,255,255,.1)",transition:"background .3s"}}/>
<div style={{fontSize:11,color:"rgba(248,246,241,.5)",flex:1}}>{it.n}</div>
<div style={{fontSize:11,fontWeight:700,color:i<a?it.c:"transparent",transition:"color .3s"}}>{it.d}d</div></div>})}</div>}

function ChapterViz(){var chapters=["Credentials","Licensure","Clients","Scope","Insurance","Compliance","ATS","Sourcing","Outreach","Resume","Interview","Billing","Review"];
var _a=useState(0),a=_a[0],sA=_a[1];
useEffect(function(){var t=setTimeout(function(){if(a<chapters.length)sA(a+1)},100);return function(){clearTimeout(t)}},[a]);
return <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:4}}>
{chapters.map(function(c,i){return <div key={c} style={{padding:"4px 10px",borderRadius:6,fontSize:9,fontWeight:600,background:i<a?"rgba(139,115,85,.15)":"rgba(255,255,255,.02)",color:i<a?"#8B7355":"rgba(248,246,241,.1)",border:"1px solid "+(i<a?"rgba(139,115,85,.2)":"rgba(255,255,255,.04)"),transition:"all .2s",letterSpacing:.3}}>{c}</div>})}</div>}

function CertViz(){var _a=useState(false),a=_a[0],sA=_a[1];
useEffect(function(){var t=setTimeout(function(){sA(true)},400);return function(){clearTimeout(t)}},[]);
return <div style={{textAlign:"center"}}>
<div style={{display:"inline-block",padding:"16px 32px",border:"2px solid "+(a?"#8B7355":"rgba(255,255,255,.06)"),borderRadius:12,background:a?"rgba(139,115,85,.06)":"transparent",transition:"all .6s"}}>
<div style={{fontSize:10,color:a?"#8B7355":"rgba(248,246,241,.15)",letterSpacing:3,textTransform:"uppercase",marginBottom:4,transition:"color .6s"}}>CERTIFICATE OF COMPLETION</div>
<div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:20,fontWeight:600,color:a?"#F8F6F1":"rgba(248,246,241,.1)",transition:"color .6s"}}>Healthcare 101</div>
<div style={{fontSize:10,color:a?"rgba(248,246,241,.4)":"rgba(248,246,241,.05)",marginTop:4,transition:"color .6s"}}>Desta Works University</div>
</div></div>}

/* ========== MAIN APP ========== */
function App(){
var saved=null;
try{var ss=localStorage.getItem("desta_ats_session");if(ss)saved=JSON.parse(ss)}catch(e){}
if(!saved)try{var ss2=localStorage.getItem("desta_op_session");if(ss2)saved=JSON.parse(ss2)}catch(e){}

var _ph=useState(saved?"auth":"intro"),ph=_ph[0],sPh=_ph[1];
var _sc=useState(0),sc=_sc[0],sSc=_sc[1];
var _fd=useState(false),fd=_fd[0],sFd=_fd[1];
var _sel=useState("ats"),sel=_sel[0],sSel=_sel[1];
var _selUni=useState("hc101"),selUni=_selUni[0],sSelUni=_selUni[1];
var _ue=useState(""),ue=_ue[0],sUE=_ue[1];
var _pw=useState(""),pw=_pw[0],sPW=_pw[1];
var _ae=useState(""),ae=_ae[0],sAE=_ae[1];
var _hovName=useState(""),hovName=_hovName[0],sHov=_hovName[1];

var ADMINS=["biruhmezgebu1@gmail.com"];
var U="https://script.google.com/macros/s/AKfycbwa725xDxl3auLiZQ-AYxM1--rUOqaYCHM8RXr4mY_-5bX6qUloUUw3uufLBSD6YCBqQQ/exec";
var URLS={ats:"https://biruhmezgebu1.github.io/desta-ats/",operate:"https://biruhmezgebu1.github.io/desta-operate/",hc101:"https://biruhmezgebu1.github.io/healthcare-101/",w1:"https://biruhmezgebu1.github.io/Desta-University/"};

var slides=[
{t:"Track Every Candidate",s:"9-stage pipeline from sourcing to placement",cat:"RECRUIT",v:"pipeline"},
{t:"Verify Credentials Instantly",s:"Direct links to CT, NJ, FL, MA state boards",cat:"RECRUIT",v:"creds"},
{t:"Payer Enrollment Pipeline",s:"Track credentialing status across every insurance payer",cat:"OPERATE",v:"payer"},
{t:"Compliance Monitoring",s:"License renewals, DEA, malpractice — never miss an expiry",cat:"OPERATE",v:"compliance"},
{t:"13 Interactive Chapters",s:"From healthcare fundamentals to recruiting operations",cat:"UNIVERSITY",v:"chapters"},
{t:"Earn Your Certificate",s:"Scored assessments with printable credentials",cat:"UNIVERSITY",v:"cert"}
];

useEffect(function(){if(ph==="intro"&&sc<slides.length){var t=setTimeout(function(){sSc(sc+1)},2800);return function(){clearTimeout(t)}}},[ph,sc]);

var finishIntro=function(){sFd(true);setTimeout(function(){sPh("auth");sFd(false)},500)};

useEffect(function(){if(ph==="intro"&&sc>=slides.length){finishIntro()}},[sc]);

var goTo=function(){window.location.href=sel==="university"?URLS[selUni]:URLS[sel]};

var signIn=function(){
if(!ue.trim()||!pw.trim()){sAE("Enter your email and password.");return}
var em=ue.trim().toLowerCase();
if(ADMINS.indexOf(em)>=0&&pw==="desta"){
try{var s={user:"Biruh Mezgebu",email:em,role:"admin"};localStorage.setItem("desta_ats_session",JSON.stringify(s));localStorage.setItem("desta_op_session",JSON.stringify(s))}catch(e){}
goTo();return}
sAE("");
var btn=document.getElementById("signBtn");btn.textContent="Signing in...";btn.disabled=true;
fetch(U).then(function(r){return r.json()}).then(function(d){
var inv=d.invites||[],m=null;
for(var i=0;i<inv.length;i++){if(inv[i].Email&&inv[i].Email.toLowerCase()===em&&inv[i].Password===pw){m=inv[i];break}}
if(m){try{var s={user:m.Name||em,email:em,role:"associate"};localStorage.setItem("desta_ats_session",JSON.stringify(s));localStorage.setItem("desta_op_session",JSON.stringify(s))}catch(e){}goTo()}
else{sAE("Invalid email or password.");btn.textContent="Sign In";btn.disabled=false}
}).catch(function(){sAE("Connection error.");btn.textContent="Sign In";btn.disabled=false})};

/* ===== INTRO ===== */
if(ph==="intro")return(
<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",opacity:fd?0:1,transition:"opacity .5s"}} onClick={function(){if(sc>0)finishIntro()}}>
<div className="grid-bg"/>
<div style={{textAlign:"center",maxWidth:440,padding:24,position:"relative",zIndex:1}}>
{/* Skip */}
<div style={{position:"fixed",top:20,right:24,zIndex:10}}>
<div onClick={finishIntro} style={{padding:"8px 20px",borderRadius:20,border:"1px solid rgba(255,255,255,.1)",color:"rgba(248,246,241,.4)",fontSize:12,cursor:"pointer",background:"rgba(255,255,255,.03)",transition:"all .2s"}}>Skip</div></div>

{/* Logo */}
<div style={{marginBottom:8}}>
<span className="serif" style={{fontSize:12,color:"#8B7355",letterSpacing:6}}>D E S T A &nbsp;&nbsp; W O R K S</span>
</div>

{/* Title */}
<div className="serif" style={{fontSize:36,fontWeight:600,lineHeight:1.2,marginBottom:6,animation:"fadeUp .4s ease"}}>
{sc<slides.length?slides[sc].t:"Desta Works"}
</div>

{/* Category badge */}
{sc<slides.length&&<div style={{fontSize:10,letterSpacing:3,color:"rgba(248,246,241,.3)",marginBottom:16}}>{slides[sc].cat}</div>}

{/* Subtitle */}
<div style={{fontSize:13,color:"rgba(248,246,241,.4)",marginBottom:24,animation:"fadeIn .4s ease"}}>
{sc<slides.length?slides[sc].s:"Recruit · Operate · Train"}
</div>

{/* Visualization */}
<div style={{minHeight:100,display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn .4s ease"}} key={sc}>
{sc<slides.length&&slides[sc].v==="pipeline"&&<PipelineViz/>}
{sc<slides.length&&slides[sc].v==="creds"&&<CredentialViz/>}
{sc<slides.length&&slides[sc].v==="payer"&&<PayerViz/>}
{sc<slides.length&&slides[sc].v==="compliance"&&<ComplianceViz/>}
{sc<slides.length&&slides[sc].v==="chapters"&&<ChapterViz/>}
{sc<slides.length&&slides[sc].v==="cert"&&<CertViz/>}
</div>

{/* Progress dots */}
<div style={{display:"flex",justifyContent:"center",gap:6,marginTop:24}}>
{slides.map(function(_,i){return <div key={i} style={{width:i===sc?24:6,height:6,borderRadius:3,background:i===sc?"#8B7355":i<sc?"rgba(139,115,85,.3)":"rgba(255,255,255,.08)",transition:"all .3s"}}/>})}
</div>
</div></div>);

/* ===== AUTH ===== */
return(
<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,position:"relative"}}>
<div className="grid-bg"/>
<div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)",borderRadius:20,width:"100%",maxWidth:440,padding:"40px 36px",backdropFilter:"blur(20px)",position:"relative",zIndex:1,animation:"fadeUp .4s ease"}}>

<div style={{textAlign:"center",marginBottom:32}}>
<div style={{fontSize:13,color:"#8B7355",letterSpacing:6,marginBottom:8,fontWeight:500}} className="serif">D E S T A &nbsp;&nbsp; W O R K S</div>
<div className="serif" style={{fontSize:26,fontWeight:600,color:"#F8F6F1",minHeight:34,transition:"opacity .2s",opacity:hovName?1:0}}>{hovName}</div>
</div>

<div className="field-label">Select platform</div>
<div className="plat-row">
{[{id:"ats",name:"Recruit",sub:"ATS Pipeline",icon:<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>},
{id:"operate",name:"Operate",sub:"Credentialing",icon:<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>},
{id:"university",name:"University",sub:"Training",icon:<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>}
].map(function(p){return <div key={p.id} className={"plat-opt"+(sel===p.id?" on":"")} onClick={function(){sSel(p.id)}} onMouseEnter={function(){sHov(p.name)}} onMouseLeave={function(){sHov("")}}>
<div className="plat-icon">{p.icon}</div>
<div className="plat-name">{p.name}</div>
<div className="plat-sub">{p.sub}</div>
</div>})}
</div>

{sel==="university"&&<div>
<div className="field-label">Select course</div>
<div className="uni-row">
<div className={"uni-opt"+(selUni==="hc101"?" on":"")} onClick={function(){sSelUni("hc101")}}>
<div style={{fontSize:16}}>📚</div><div style={{fontSize:12,fontWeight:700,marginTop:6,color:"#F8F6F1"}}>Healthcare 101</div><div style={{fontSize:10,color:"rgba(248,246,241,.3)",marginTop:2}}>13 chapters</div></div>
<div className={"uni-opt"+(selUni==="w1"?" on":"")} onClick={function(){sSelUni("w1")}}>
<div style={{fontSize:16}}>🔬</div><div style={{fontSize:12,fontWeight:700,marginTop:6,color:"#F8F6F1"}}>Week 1 Training</div><div style={{fontSize:10,color:"rgba(248,246,241,.3)",marginTop:2}}>6 modules</div></div>
</div></div>}

<div className="divider"/>

<div style={{marginBottom:14}}><div className="field-label">Email</div>
<input className="field-input" value={ue} onChange={function(e){sUE(e.target.value)}} onKeyDown={function(e){if(e.key==="Enter")document.getElementById("pwField").focus()}} placeholder="your@email.com" type="email"/></div>
<div style={{marginBottom:20}}><div className="field-label">Password</div>
<input id="pwField" className="field-input" type="password" value={pw} onChange={function(e){sPW(e.target.value)}} onKeyDown={function(e){if(e.key==="Enter")signIn()}} placeholder="Enter your password"/></div>

{ae&&<div className="error-msg">{ae}</div>}
<button className="sign-btn" id="signBtn" onClick={signIn}>Sign In</button>

<div style={{textAlign:"center",marginTop:24,fontSize:10,color:"rgba(248,246,241,.2)",letterSpacing:2}}>DESTA WORKS — ADDIS ABABA, ETHIOPIA</div>
</div></div>)}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</head>
<body><div class="grid-bg"></div><div id="root"></div></body>
</html>
