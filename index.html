<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desta Works</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#0a0a1a 0%,#0f1628 40%,#121a2e 70%,#1a1510 100%);color:#F8F6F1;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(139,115,85,.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes barGrow{from{height:0}to{height:var(--h)}}
@keyframes badgePop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.grid-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:20px;width:100%;max-width:460px;padding:36px 32px;backdrop-filter:blur(20px)}
.fl{font-size:10px;color:rgba(248,246,241,.3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.fi{width:100%;padding:13px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#F8F6F1;font-size:14px;font-family:inherit;transition:all .2s;outline:none}
.fi:focus{border-color:rgba(139,115,85,.4);background:rgba(255,255,255,.06)}
.fi::placeholder{color:rgba(248,246,241,.2)}
.sb{width:100%;padding:14px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;background:linear-gradient(135deg,#8B7355,#A68B6B);color:#F8F6F1;letter-spacing:.3px}
.sb:hover{box-shadow:0 8px 24px rgba(139,115,85,.2)}.sb:disabled{opacity:.4;cursor:default;box-shadow:none}
.err{font-size:12px;color:#FF8A80;background:rgba(255,138,128,.08);border:1px solid rgba(255,138,128,.12);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.ok{font-size:12px;color:#66BB6A;background:rgba(102,187,106,.08);border:1px solid rgba(102,187,106,.15);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.tab-row{display:flex;background:rgba(255,255,255,.04);border-radius:10px;padding:3px;margin-bottom:24px}
.tab-btn{flex:1;padding:10px;text-align:center;border-radius:8px;border:none;background:transparent;color:rgba(248,246,241,.4);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.tab-btn.on{background:rgba(255,255,255,.08);color:#F8F6F1}
.plat-row{display:flex;gap:8px;margin-bottom:20px}
.plat-opt{flex:1;padding:14px 8px;border:1px solid rgba(255,255,255,.06);border-radius:12px;cursor:pointer;transition:all .25s;text-align:center;background:rgba(255,255,255,.02);position:relative}
.plat-opt:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.plat-opt.on{border-color:rgba(139,115,85,.4);background:rgba(139,115,85,.06);box-shadow:0 0 0 3px rgba(139,115,85,.08)}
.plat-opt.locked{opacity:.3;cursor:not-allowed;pointer-events:none}
.plat-opt .lock-badge{position:absolute;top:6px;right:6px;font-size:10px}
.plat-name{font-size:12px;font-weight:700;margin-top:8px;color:#F8F6F1}
.plat-sub{font-size:9px;color:rgba(248,246,241,.3);margin-top:2px}
.plat-icon{width:32px;height:32px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.uni-row{display:flex;gap:8px;margin-bottom:16px}
.uni-opt{flex:1;padding:12px 8px;border:1px solid rgba(255,255,255,.06);border-radius:10px;cursor:pointer;transition:all .25s;text-align:center;background:rgba(255,255,255,.02)}
.uni-opt:hover{border-color:rgba(255,255,255,.12)}.uni-opt.on{border-color:rgba(139,115,85,.4);background:rgba(139,115,85,.06);box-shadow:0 0 0 3px rgba(139,115,85,.08)}
.uni-opt.locked{opacity:.3;cursor:not-allowed;pointer-events:none}
.divider{height:1px;background:rgba(255,255,255,.06);margin:16px 0}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer}
.check-box{width:18px;height:18px;border-radius:4px;border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:11px;flex-shrink:0}
.check-box.on{background:rgba(139,115,85,.3);border-color:#8B7355;color:#8B7355}
@media(max-width:480px){.card{padding:28px 20px}.plat-row{gap:5px}}
</style>
<script type="text/babel">
var useState=React.useState,useEffect=React.useEffect;
var U="https://script.google.com/macros/s/AKfycbwa725xDxl3auLiZQ-AYxM1--rUOqaYCHM8RXr4mY_-5bX6qUloUUw3uufLBSD6YCBqQQ/exec";
var ADMINS=["biruhmezgebu1@gmail.com"];
var URLS={ats:"https://biruhmezgebu1.github.io/desta-ats/",operate:"https://biruhmezgebu1.github.io/desta-operate/",hc101:"https://biruhmezgebu1.github.io/healthcare-101/",w1:"https://biruhmezgebu1.github.io/Desta-University/"};
var ALL_PLATS=["ats","operate","hc101","w1"];

function post(d){return fetch(U,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(d)}).catch(function(){})}

function App(){
var _mode=useState("intro"),mode=_mode[0],sMode=_mode[1];
var _tab=useState("signin"),tab=_tab[0],sTab=_tab[1];
var _ue=useState(""),ue=_ue[0],sUE=_ue[1];
var _pw=useState(""),pw=_pw[0],sPW=_pw[1];
var _ae=useState(""),ae=_ae[0],sAE=_ae[1];
var _ok=useState(""),ok=_ok[0],sOK=_ok[1];
var _sel=useState("ats"),sel=_sel[0],sSel=_sel[1];
var _selUni=useState("hc101"),selUni=_selUni[0],sSelUni=_selUni[1];
var _hovName=useState(""),hovName=_hovName[0],sHov=_hovName[1];
var _access=useState(null),access=_access[0],sAccess=_access[1];
var _userName=useState(""),userName=_userName[0],sUserName=_userName[1];
/* Sign up fields */
var _sName=useState(""),sName=_sName[0],sSName=_sName[1];
var _sEmail=useState(""),sEmail=_sEmail[0],sSEmail=_sEmail[1];
var _sOrg=useState(""),sOrg=_sOrg[0],sSOrg=_sOrg[1];
var _sMsg=useState(""),sMsg=_sMsg[0],sSMsg=_sMsg[1];

/* Intro slides */
var _sc=useState(0),sc=_sc[0],sSc=_sc[1];

var slides=[
{t:"Track Every Candidate",s:"9-stage pipeline from sourcing to placement",cat:"RECRUIT"},
{t:"Payer Enrollment Pipeline",s:"Track credentialing across every insurance payer",cat:"OPERATE"},
{t:"13 Interactive Chapters",s:"From healthcare fundamentals to recruiting operations",cat:"UNIVERSITY"}
];

useEffect(function(){if(mode==="intro"&&sc<slides.length){var t=setTimeout(function(){sSc(sc+1)},2200);return function(){clearTimeout(t)}}},[mode,sc]);
useEffect(function(){if(mode==="intro"&&sc>=slides.length){setTimeout(function(){sMode("auth")},600)}},[sc]);

var hasAccess=function(plat){if(!access)return false;if(access==="all")return true;return access.indexOf(plat)>=0};

var signIn=function(){
if(!ue.trim()||!pw.trim()){sAE("Enter your email and password.");return}
var em=ue.trim().toLowerCase();sAE("");sOK("");
/* Admin */
if(ADMINS.indexOf(em)>=0&&pw==="desta"){
var s={user:"Biruh Mezgebu",email:em,role:"admin",platforms:"all"};
try{localStorage.setItem("desta_ats_session",JSON.stringify(s));localStorage.setItem("desta_op_session",JSON.stringify(s))}catch(e){}
sAccess("all");sUserName("Biruh Mezgebu");sMode("hub");return}
/* Check invites */
var btn=document.getElementById("signBtn");if(btn){btn.textContent="Signing in...";btn.disabled=true}
fetch(U).then(function(r){return r.json()}).then(function(d){
var inv=d.invites||[];var m=null;
for(var i=0;i<inv.length;i++){if(inv[i].Email&&inv[i].Email.toLowerCase()===em&&inv[i].Password===pw){m=inv[i];break}}
if(m){
var platforms=m.Platform||"all";
var s={user:m.Name||em,email:em,role:"associate",platforms:platforms};
try{localStorage.setItem("desta_ats_session",JSON.stringify(s));localStorage.setItem("desta_op_session",JSON.stringify(s))}catch(e){}
sAccess(platforms);sUserName(m.Name||em);sMode("hub")}
else{sAE("Invalid email or password.");if(btn){btn.textContent="Sign In";btn.disabled=false}}
}).catch(function(){sAE("Connection error.");if(btn){btn.textContent="Sign In";btn.disabled=false}})};

var requestAccess=function(){
if(!sName.trim()||!sEmail.trim()){sAE("Name and email are required.");return}
sAE("");
post({event:"access_request",email:sEmail.trim(),name:sName.trim(),details:"Org: "+(sOrg||"N/A")+". Message: "+(sMsg||"None")});
sOK("Access request submitted. You will receive an email when your account is activated.");
sSName("");sSEmail("");sSOrg("");sSMsg("")};

var goTo=function(){
var target=sel==="university"?URLS[selUni]:URLS[sel];
/* Check access */
var platKey=sel==="university"?selUni:sel;
if(access!=="all"&&access&&access.indexOf(platKey)<0){sAE("You don't have access to this platform. Contact your administrator.");return}
window.location.href=target};

/* INTRO */
if(mode==="intro")return(
<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}} onClick={function(){sMode("auth")}}>
<div className="grid-bg"/>
<div style={{textAlign:"center",maxWidth:400,padding:24,position:"relative",zIndex:1}}>
<div style={{position:"fixed",top:20,right:24,zIndex:10}}>
<div onClick={function(e){e.stopPropagation();sMode("auth")}} style={{padding:"8px 20px",borderRadius:20,border:"1px solid rgba(255,255,255,.1)",color:"rgba(248,246,241,.4)",fontSize:12,cursor:"pointer",background:"rgba(255,255,255,.03)"}}>Skip</div></div>
<div style={{marginBottom:6}}><span className="serif" style={{fontSize:13,color:"#8B7355",letterSpacing:6}}>D E S T A &nbsp;&nbsp; W O R K S</span></div>
{sc<slides.length&&<div>
<div className="serif" style={{fontSize:32,fontWeight:600,lineHeight:1.2,marginBottom:6,animation:"fadeUp .3s ease"}} key={sc}>{slides[sc].t}</div>
<div style={{fontSize:10,letterSpacing:3,color:"rgba(248,246,241,.3)",marginBottom:12}}>{slides[sc].cat}</div>
<div style={{fontSize:13,color:"rgba(248,246,241,.4)",animation:"fadeIn .3s ease"}}>{slides[sc].s}</div></div>}
<div style={{display:"flex",justifyContent:"center",gap:6,marginTop:24}}>
{slides.map(function(_,i){return <div key={i} style={{width:i===sc?24:6,height:6,borderRadius:3,background:i===sc?"#8B7355":i<sc?"rgba(139,115,85,.3)":"rgba(255,255,255,.08)",transition:"all .3s"}}/>})}</div>
</div></div>);

/* HUB - post login platform selector */
if(mode==="hub")return(
<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,position:"relative"}}>
<div className="grid-bg"/>
<div className="card" style={{maxWidth:500,animation:"fadeUp .4s ease",position:"relative",zIndex:1}}>
<div style={{textAlign:"center",marginBottom:24}}>
<div style={{fontSize:13,color:"#8B7355",letterSpacing:6,marginBottom:6,fontWeight:500}} className="serif">D E S T A &nbsp;&nbsp; W O R K S</div>
<div className="serif" style={{fontSize:22,fontWeight:600}}>Welcome, {userName.split(" ")[0]}</div>
<div style={{fontSize:12,color:"rgba(248,246,241,.3)",marginTop:4}}>Select a platform to continue</div>
</div>

<div className="plat-row">
{[{id:"ats",name:"Recruit",sub:"ATS Pipeline",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>},
{id:"operate",name:"Operate",sub:"Credentialing",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>},
{id:"university",name:"University",sub:"Training",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>}
].map(function(p){var locked=!hasAccess(p.id==="university"?"hc101":p.id);
return <div key={p.id} className={"plat-opt"+(sel===p.id?" on":"")+(locked?" locked":"")} onClick={function(){if(!locked)sSel(p.id)}}>
{locked&&<div className="lock-badge">🔒</div>}
<div className="plat-icon">{p.icon}</div>
<div className="plat-name">{p.name}</div>
<div className="plat-sub">{locked?"No access":p.sub}</div>
</div>})}
</div>

{sel==="university"&&<div>
<div className="uni-row">
<div className={"uni-opt"+(selUni==="hc101"?" on":"")+(!hasAccess("hc101")?" locked":"")} onClick={function(){if(hasAccess("hc101"))sSelUni("hc101")}}>
{!hasAccess("hc101")&&<span style={{fontSize:10}}>🔒</span>}
<div style={{fontSize:11,fontWeight:700,marginTop:4,color:"#F8F6F1"}}>Healthcare 101</div>
<div style={{fontSize:9,color:"rgba(248,246,241,.3)"}}>13 chapters</div></div>
<div className={"uni-opt"+(selUni==="w1"?" on":"")+(!hasAccess("w1")?" locked":"")} onClick={function(){if(hasAccess("w1"))sSelUni("w1")}}>
{!hasAccess("w1")&&<span style={{fontSize:10}}>🔒</span>}
<div style={{fontSize:11,fontWeight:700,marginTop:4,color:"#F8F6F1"}}>Week 1 Training</div>
<div style={{fontSize:9,color:"rgba(248,246,241,.3)"}}>6 modules</div></div>
</div></div>}

{ae&&<div className="err">{ae}</div>}
<button className="sb" onClick={goTo}>Continue</button>

<div style={{textAlign:"center",marginTop:16}}>
<span onClick={function(){try{localStorage.removeItem("desta_ats_session");localStorage.removeItem("desta_op_session")}catch(x){};sMode("auth");sAccess(null);sUE("");sPW("");sAE("")}} style={{fontSize:11,color:"rgba(248,246,241,.25)",cursor:"pointer",textDecoration:"underline"}}>Sign out</span>
</div>
</div></div>);

/* AUTH - sign in + sign up */
return(
<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,position:"relative"}}>
<div className="grid-bg"/>
<div className="card" style={{animation:"fadeUp .4s ease",position:"relative",zIndex:1}}>

<div style={{textAlign:"center",marginBottom:24}}>
<div style={{fontSize:13,color:"#8B7355",letterSpacing:6,marginBottom:8,fontWeight:500}} className="serif">D E S T A &nbsp;&nbsp; W O R K S</div>
<div className="serif" style={{fontSize:22,fontWeight:600,color:"#F8F6F1",minHeight:30,transition:"opacity .2s",opacity:hovName?1:0}}>{hovName}</div>
</div>

{/* Tabs */}
<div className="tab-row">
<div className={"tab-btn"+(tab==="signin"?" on":"")} onClick={function(){sTab("signin");sAE("");sOK("")}}>Sign In</div>
<div className={"tab-btn"+(tab==="signup"?" on":"")} onClick={function(){sTab("signup");sAE("");sOK("")}}>Request Access</div>
</div>

{/* SIGN IN */}
{tab==="signin"&&<div>
<div className="fl">Select platform</div>
<div className="plat-row">
{[{id:"ats",name:"Recruit",sub:"ATS Pipeline",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>},
{id:"operate",name:"Operate",sub:"Credentialing",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>},
{id:"university",name:"University",sub:"Training",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(248,246,241,.5)" strokeWidth="1.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>}
].map(function(p){return <div key={p.id} className={"plat-opt"+(sel===p.id?" on":"")} onClick={function(){sSel(p.id)}} onMouseEnter={function(){sHov(p.name)}} onMouseLeave={function(){sHov("")}}>
<div className="plat-icon">{p.icon}</div>
<div className="plat-name">{p.name}</div>
<div className="plat-sub">{p.sub}</div>
</div>})}
</div>

{sel==="university"&&<div className="uni-row">
<div className={"uni-opt"+(selUni==="hc101"?" on":"")} onClick={function(){sSelUni("hc101")}}>
<div style={{fontSize:11,fontWeight:700,color:"#F8F6F1"}}>Healthcare 101</div>
<div style={{fontSize:9,color:"rgba(248,246,241,.3)"}}>13 chapters</div></div>
<div className={"uni-opt"+(selUni==="w1"?" on":"")} onClick={function(){sSelUni("w1")}}>
<div style={{fontSize:11,fontWeight:700,color:"#F8F6F1"}}>Week 1 Training</div>
<div style={{fontSize:9,color:"rgba(248,246,241,.3)"}}>6 modules</div></div>
</div>}

<div className="divider"/>

<div style={{marginBottom:14}}><div className="fl">Email</div>
<input className="fi" type="email" value={ue} onChange={function(e){sUE(e.target.value)}} onKeyDown={function(e){if(e.key==="Enter")document.getElementById("pwf").focus()}} placeholder="your@email.com"/></div>
<div style={{marginBottom:16}}><div className="fl">Password</div>
<input id="pwf" className="fi" type="password" value={pw} onChange={function(e){sPW(e.target.value)}} onKeyDown={function(e){if(e.key==="Enter")signIn()}} placeholder="Enter your password"/></div>

{ae&&<div className="err">{ae}</div>}
<button className="sb" id="signBtn" onClick={signIn}>Sign In</button>
</div>}

{/* SIGN UP / REQUEST ACCESS */}
{tab==="signup"&&<div>
<div style={{fontSize:12,color:"rgba(248,246,241,.4)",marginBottom:16,lineHeight:1.6}}>
Request access to the Desta Works platform. An administrator will review your request and provision your account with the appropriate platform access.
</div>

<div style={{marginBottom:12}}><div className="fl">Full Name *</div>
<input className="fi" value={sName} onChange={function(e){sSName(e.target.value)}} placeholder="Your full name"/></div>
<div style={{marginBottom:12}}><div className="fl">Email *</div>
<input className="fi" type="email" value={sEmail} onChange={function(e){sSEmail(e.target.value)}} placeholder="your@email.com"/></div>
<div style={{marginBottom:12}}><div className="fl">Organization</div>
<input className="fi" value={sOrg} onChange={function(e){sSOrg(e.target.value)}} placeholder="Practice or company name"/></div>
<div style={{marginBottom:16}}><div className="fl">Message</div>
<textarea className="fi" value={sMsg} onChange={function(e){sSMsg(e.target.value)}} placeholder="Tell us which platforms you need access to and how you plan to use them..." rows={3} style={{resize:"vertical"}}/></div>

{ae&&<div className="err">{ae}</div>}
{ok&&<div className="ok">{ok}</div>}
{!ok&&<button className="sb" onClick={requestAccess}>Submit Request</button>}
</div>}

<div style={{textAlign:"center",marginTop:20,fontSize:10,color:"rgba(248,246,241,.2)",letterSpacing:2}}>DESTA WORKS — ADDIS ABABA, ETHIOPIA</div>
</div></div>)}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</head>
<body><div class="grid-bg"></div><div id="root"></div></body>
</html>
